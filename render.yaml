# Render Blueprint for Lutron LMS
# Deploy via: Render Dashboard -> New -> Blueprint -> select this repo.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: lutron-backend
    runtime: python
    rootDir: lutron_backend
    buildCommand: pip install -r requirements.txt
    # Render injects $PORT (default 10000). Single worker fits Free/Starter RAM.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LMS_CLOUD_MODE
        value: "1"
      - key: DATABASE_HOST_URL
        fromDatabase:
          name: lutron-db
          property: connectionString
      # Small pool: Render Free Postgres allows limited connections.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_FERNET_KEY
        generateValue: true
      - key: MONITORING_INGEST_TOKEN
        generateValue: true
      - key: ENABLE_API_DOCS
        value: "false"
      # IMPORTANT: after Netlify deploy, set this to your real frontend URL, e.g.
      # https://your-site.netlify.app — comma-separated, no trailing slash.
      # Until then the API falls back to localhost origins and browsers will block
      # cross-origin calls from Netlify.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: lutron-db
    databaseName: lutron
    user: lutron
    plan: free
